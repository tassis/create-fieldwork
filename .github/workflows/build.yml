name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.2.1'

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          mod_id="$(sed -n 's/^mod_id=//p' gradle.properties)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "mod_version is invalid: $version" >&2
            exit 1
          fi
          if [[ ! "$minecraft_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "minecraft_version must be numeric, got: $minecraft_version" >&2
            exit 1
          fi
          if [[ ! "$mod_id" =~ ^[a-z][a-z0-9_]*$ ]]; then
            echo "mod_id is invalid: $mod_id" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # Matches build.gradle's archivesName; this project is NeoForge-only.
          echo "artifact_name=${mod_id}-neoforge-${minecraft_version}-${version}" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: gradle --no-daemon clean test build

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-${{ github.run_number }}
          path: build/reports/tests/test/
          if-no-files-found: ignore

      - name: Upload mod JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: build/libs/${{ steps.version.outputs.artifact_name }}.jar
          if-no-files-found: error

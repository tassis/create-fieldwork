name: Release

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Exact mod_version from gradle.properties
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.2.1'

      - name: Validate release request
        id: version
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main, got: $GITHUB_REF" >&2
            exit 1
          fi

          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          mod_id="$(sed -n 's/^mod_id=//p' gradle.properties)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "mod_version is invalid: $version" >&2
            exit 1
          fi
          if [[ ! "$minecraft_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "minecraft_version must be numeric, got: $minecraft_version" >&2
            exit 1
          fi
          if [[ ! "$mod_id" =~ ^[a-z][a-z0-9_]*$ ]]; then
            echo "mod_id is invalid: $mod_id" >&2
            exit 1
          fi
          if [[ "$CONFIRM_VERSION" != "$version" ]]; then
            echo "Confirmation '$CONFIRM_VERSION' does not match mod_version=$version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${mod_id}-neoforge-${minecraft_version}-${version}" >> "$GITHUB_OUTPUT"

      - name: Check existing tag and Release
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set +e
          release_response="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1)"
          release_status=$?
          set -e

          if [[ $release_status -eq 0 ]]; then
            release_exists=true
            release_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$release_draft" == "true" ]]; then
              echo "release_draft_exists=true" >> "$GITHUB_OUTPUT"
              echo "release_published_exists=false" >> "$GITHUB_OUTPUT"
            else
              echo "release_draft_exists=false" >> "$GITHUB_OUTPUT"
              echo "release_published_exists=true" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$release_response" == *"HTTP 404"* ]]; then
            release_exists=false
            echo "release_draft_exists=false" >> "$GITHUB_OUTPUT"
            echo "release_published_exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$release_response" >&2
            exit "$release_status"
          fi

          set +e
          tag_response="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>&1)"
          tag_status=$?
          set -e

          if [[ $tag_status -eq 0 ]]; then
            tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.type)"
            tag_object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
            if [[ "$tag_type" != "tag" ]]; then
              echo "Tag $TAG is lightweight or malformed; an annotated tag is required" >&2
              exit 1
            fi

            target_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq .object.type)"
            existing_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq .object.sha)"
            if [[ "$target_type" != "commit" || "$existing_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG resolves to ${target_type}:${existing_commit}, expected commit:$GITHUB_SHA" >&2
              exit 1
            fi
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tag_response" == *"HTTP 404"* ]]; then
            if [[ "$release_exists" == "true" ]]; then
              echo "Release $TAG exists without its required annotated tag" >&2
              exit 1
            fi
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$tag_response" >&2
            exit "$tag_status"
          fi

      - name: Test and build release artifact
        run: gradle --no-daemon clean test build

      - name: Prepare release files
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        shell: bash
        run: |
          install -d dist
          jar="build/libs/${ARTIFACT_NAME}.jar"
          test -f "$jar"
          cp "$jar" "dist/${ARTIFACT_NAME}.jar"
          checksum="$(sha256sum "dist/${ARTIFACT_NAME}.jar" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$checksum" "${ARTIFACT_NAME}.jar" > "dist/${ARTIFACT_NAME}.jar.sha256"

      - name: Upload release build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            dist/${{ steps.version.outputs.artifact_name }}.jar
            dist/${{ steps.version.outputs.artifact_name }}.jar.sha256
          if-no-files-found: error

      - name: Create annotated release tag
        if: steps.preflight.outputs.release_published_exists != 'true' && steps.preflight.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          tag_object_sha="$(gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG" \
            -f message="Create: Fieldwork ${VERSION}" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="$tag_object_sha" >/dev/null

      - name: Create draft GitHub Release
        if: steps.preflight.outputs.release_published_exists != 'true' && steps.preflight.outputs.release_draft_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          release_args=(
            "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --draft
            --title "Create: Fieldwork ${VERSION}"
            --generate-notes
          )
          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"

      - name: Normalize draft Release metadata
        if: steps.preflight.outputs.release_published_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          prerelease=false
          if [[ "$VERSION" == *-* ]]; then
            prerelease=true
          fi
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=true \
            --prerelease="$prerelease" \
            --title "Create: Fieldwork ${VERSION}"

      - name: Upload and verify Release assets
        if: steps.preflight.outputs.release_published_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        shell: bash
        run: |
          gh release upload "$TAG" \
            "dist/${ARTIFACT_NAME}.jar" \
            "dist/${ARTIFACT_NAME}.jar.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          install -d verified-release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir verified-release \
            --pattern "${ARTIFACT_NAME}.jar" \
            --pattern "${ARTIFACT_NAME}.jar.sha256"
          cmp "dist/${ARTIFACT_NAME}.jar" "verified-release/${ARTIFACT_NAME}.jar"
          cmp "dist/${ARTIFACT_NAME}.jar.sha256" "verified-release/${ARTIFACT_NAME}.jar.sha256"

      - name: Publish GitHub Release
        if: steps.preflight.outputs.release_published_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Verify existing published Release
        if: steps.preflight.outputs.release_published_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        shell: bash
        run: |
          expected_prerelease=false
          if [[ "$VERSION" == *-* ]]; then
            expected_prerelease=true
          fi

          title="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name)"
          prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          if [[ "$title" != "Create: Fieldwork ${VERSION}" || "$prerelease" != "$expected_prerelease" ]]; then
            echo "Published Release $TAG metadata does not match this release request" >&2
            exit 1
          fi

          install -d verified-release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir verified-release \
            --pattern "${ARTIFACT_NAME}.jar" \
            --pattern "${ARTIFACT_NAME}.jar.sha256"
          cmp "dist/${ARTIFACT_NAME}.jar" "verified-release/${ARTIFACT_NAME}.jar"
          cmp "dist/${ARTIFACT_NAME}.jar.sha256" "verified-release/${ARTIFACT_NAME}.jar.sha256"
